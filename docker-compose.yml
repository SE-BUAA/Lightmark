# =====================================================================
# Lightmark（拾光旅行）容器编排 —— 本地开发 / 课程演示 / 单机部署
#
# 服务组成：
#   mysql   —— MySQL 8.0 官方镜像；首次启动时自动执行 database/ 下的
#              建表 + 测试数据脚本（官方 /docker-entrypoint-initdb.d 机制）
#   backend —— Spring Boot 后端（backend/Dockerfile）
#   nginx   —— 前端静态资源 + /api 反向代理（frontend/Dockerfile.nginx）
#
# 用法：
#   1) cp .env.example .env 并填写 DB / JWT / AI 等密钥
#   2) 本地直接构建运行：docker compose up -d --build
#   3) CI/CD 拉取版本化镜像：IMAGE_TAG=1.0.123 docker compose up -d
#      （默认 image 标签来自 ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/<svc>:${IMAGE_TAG}）
#
# 换一台机器：安装 Docker Desktop / Docker Engine + Compose 插件后，
# 按 README「新机器启动」一节执行即可，数据库会自动初始化。
# =====================================================================
name: lightmark

services:
  mysql:
    # 官方镜像，固定版本号（不随 latest 漂移）
    image: mysql:8.0.43
    container_name: lightmark-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lightmark}
      MYSQL_USER: ${MYSQL_USER:-lightmark}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 宿主机已有 MySQL 时把 MYSQL_PORT 改成 3307 等空闲端口
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动读入 database/ 下所有 *.sql 建表/测试数据脚本
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - lightmark-net

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lightmark}/backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lightmark-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080

      # 容器内通过服务名访问数据库（compose 与 k8s 一致）
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-lightmark}
      DB_USER: ${DB_USER:-lightmark}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-lightmark}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.deepseek.com/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://newapi.stuhelper.com/v1}
      LIGHTMARK_AI_API_URL: ${LIGHTMARK_AI_API_URL:-${AI_API_URL:-https://api.deepseek.com/chat/completions}}
      LIGHTMARK_AI_API_KEY: ${LIGHTMARK_AI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      LIGHTMARK_AI_MODEL: ${LIGHTMARK_AI_MODEL:-${AI_MODEL:-deepseek-v4-flash}}
      LIGHTMARK_DEEPSEEK_BASE_URL: ${LIGHTMARK_DEEPSEEK_BASE_URL:-${DEEPSEEK_BASE_URL:-https://newapi.stuhelper.com/v1}}

      AUTH_MAIL_USERNAME: ${AUTH_MAIL_USERNAME:-}
      AUTH_MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD:-}
      AUTH_MAIL_FROM_EMAIL: ${AUTH_MAIL_FROM_EMAIL:-}

      OBJECT_STORAGE_BASE_URL: ${OBJECT_STORAGE_BASE_URL:-}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - lightmark-net

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lightmark}/frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    container_name: lightmark-nginx
    depends_on:
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # 无证书的本地环境：NGINX_CONF=./deploy/nginx.http.conf（见 README）
      - ${NGINX_CONF:-./deploy/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:-./deploy/certs}/origin.crt:/etc/nginx/certs/origin.crt:ro
      - ${CERT_DIR:-./deploy/certs}/origin.key:/etc/nginx/certs/origin.key:ro
    restart: unless-stopped
    networks:
      - lightmark-net

volumes:
  mysql-data:
    name: lightmark-mysql-data

networks:
  lightmark-net:
    driver: bridge
