# =====================================================================
# MySQL 8.0（官方镜像，固定版本号）
#
# - Service 名为 mysql，与 docker-compose 服务名一致，.env 中 DB_HOST=mysql
#   在 compose 与 k8s 下通用
# - 首次启动（PVC 为空）时自动执行 ConfigMap lightmark-init-sql
#   （由 scripts/deploy-k8s.sh 从 database/lightmark.sql 生成）中的建表/测试数据
# - 数据持久化到 PVC lightmark-mysql-pvc（k3s 默认 local-path 即可）
# - 数据库账号密码来自 Secret lightmark-secrets（由 .env 生成）
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightmark-mysql-pvc
  namespace: lightmark
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: lightmark
  labels:
    app: lightmark
    tier: db
spec:
  type: ClusterIP
  selector:
    app: lightmark-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightmark-mysql
  namespace: lightmark
  labels:
    app: lightmark
    tier: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lightmark-mysql
  template:
    metadata:
      labels:
        app: lightmark-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.43
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
          envFrom:
            - secretRef:
                name: lightmark-secrets
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: lightmark-mysql-pvc
        - name: mysql-init
          configMap:
            name: lightmark-init-sql
