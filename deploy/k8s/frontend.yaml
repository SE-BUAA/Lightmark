# =====================================================================
# 前端（Nginx 静态资源）
#
# - 镜像占位符 __IMAGE_FRONTEND__ 由 scripts/deploy-k8s.sh 渲染为
#   ghcr.io/<owner>/<repo>/frontend:<版本号>
# - Service 名为 frontend，与 docker-compose 服务名一致
# - /api 转发由 Ingress 完成（见 ingress.yaml），容器内 Nginx 只托管静态资源
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lightmark
  labels:
    app: lightmark
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: lightmark-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightmark-frontend
  namespace: lightmark
  labels:
    app: lightmark
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightmark-frontend
  template:
    metadata:
      labels:
        app: lightmark-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: __IMAGE_FRONTEND__
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
