# content-service 独立部署资源；数据库和密钥由部署环境注入，不在清单中写入口令。
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: lightmark
spec:
  selector:
    app: lightmark-content-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: lightmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightmark-content-service
  template:
    metadata:
      labels:
        app: lightmark-content-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: content-service
          image: __IMAGE_CONTENT__
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: CONTENT_SERVICE_PORT
              value: "8084"
            - name: APP_VERSION
              value: "__APP_VERSION__"
            - name: CONTENT_DB_HOST
              value: "150.230.223.11"
          envFrom:
            - secretRef:
                name: content-service-secrets
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: content-service
  namespace: lightmark
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: content-service}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
