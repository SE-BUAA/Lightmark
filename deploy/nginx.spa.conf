# =====================================================================
# Nginx SPA 配置 —— 供 k8s 前端运行镜像使用（frontend/Dockerfile.runtime）
# 支持 Vue Router history 模式：次级路由刷新时回退到 index.html
# /api 由 Ingress 转发到 backend，本容器只托管静态资源
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退：不存在的路径一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源：命中即返回，未命中 404（不走 index.html 回退）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
