# =====================================================================
# Lightmark MSA CI/CD 流水线（微服务版本专用）
#
# 触发：push 到 msa-develop 分支（也可 workflow_dispatch 手动触发）。
# 与既有单体流水线 deploy.yml（develop 分支）完全独立、互不影响。
#
# 阶段与门禁（任何一步失败，后续部署立即停止，本 Run 即失败记录）：
#   ① test-msa          取代码 → mvn 全模块单元/集成测试（失败即停，不发布镜像）
#   ② build-push-images ① 通过后：matrix 构建 4 个服务镜像并推送 GHCR
#   ②' build-frontend   构建前端 SPA 镜像并推送 GHCR（与 ② 并行）
#   ③ deploy            ② ②' 全部通过后：SSH 到服务器，scripts/deploy-msa-k8s.sh 一键部署
#                        （含数据库拆分、4 服务 + 前端 + MSA Ingress、健康检查）
#   ④ health-check      公网入口验证（TLS + 域名 + 前缀路由 + 前端首页）
#
# 镜像版本号：<svc>-service-1.0.<run_number>（如 user-service-1.0.12），
# 另附 sha-<commit> 标签，不使用 latest 作为部署依据。
# 记录保留：Actions 历史 + 服务器 deploy-history.log（成功/失败均记录）。
# =====================================================================
name: MSA CI/CD 流水线

on:
  push:
    branches:
      - msa-develop
  workflow_dispatch:

concurrency:
  group: lightmark-msa-cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_VERSION: 1.0.${{ github.run_number }}

jobs:
  # ---------------------------------------------------------------
  # ① 微服务全模块测试（单元 + 集成；失败即停，不进入构建）
  # ---------------------------------------------------------------
  test-msa:
    name: ① MSA 全模块测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取代码
        uses: actions/checkout@v5
      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 安装依赖并执行全部测试
        working-directory: msa
        run: |
          mvn -B -ntp test
      - name: 上传测试报告（保留成功/失败记录）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: msa-test-reports-${{ github.sha }}
          path: |
            msa/**/target/surefire-reports
            msa/**/target/test-report-html
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # ② 构建并推送 4 个服务镜像（仅当 ① 通过）
  #    构建上下文为仓库根目录（msa/*/Dockerfile 需要 msa/pom.xml 与 lightmark-common）
  # ---------------------------------------------------------------
  build-push-images:
    name: ② 构建并推送镜像 1.0.${{ github.run_number }}
    needs: test-msa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [user, product, order, content]
    outputs:
      image_repo: ${{ steps.lowerrepo.outputs.repo }}
    steps:
      - name: 取代码
        uses: actions/checkout@v5
      - name: 计算镜像仓库名（GHCR 要求全小写）
        id: lowerrepo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 准备 QEMU（多架构构建模拟）
        uses: docker/setup-qemu-action@v3
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 ${{ matrix.service }}-service（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: msa/${{ matrix.service }}-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lowerrepo.outputs.repo }}/${{ matrix.service }}-service:${{ matrix.service }}-service-${{ env.IMAGE_VERSION }}
            ghcr.io/${{ steps.lowerrepo.outputs.repo }}/${{ matrix.service }}-service:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # ②' 构建并推送前端镜像（与 ② 并行；dist 在原生环境构建，产物平台无关）
  # ---------------------------------------------------------------
  build-frontend:
    name: ②' 构建并推送前端镜像 1.0.${{ github.run_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取代码
        uses: actions/checkout@v5
      - name: 计算镜像仓库名（GHCR 要求全小写）
        id: lowerrepo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 安装 Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 编译
        working-directory: frontend
        run: npm run build
      - name: 准备镜像构建上下文
        run: |
          mkdir -p imgctx/frontend
          cp -r frontend/dist imgctx/frontend/
          cp deploy/nginx.spa.conf imgctx/frontend/nginx.spa.conf
          [ -d imgctx/frontend/dist ] || { echo "::error::前端 dist 未生成"; exit 1; }
          ls -lh imgctx/frontend/dist | head -5
      - name: 准备 QEMU（多架构构建模拟）
        uses: docker/setup-qemu-action@v3
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送前端镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: imgctx/frontend
          file: frontend/Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lowerrepo.outputs.repo }}/frontend:frontend-${{ env.IMAGE_VERSION }}
            ghcr.io/${{ steps.lowerrepo.outputs.repo }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # ③ 一键部署到服务器 Kubernetes（仅当 ② ②' 全部通过）
  # ---------------------------------------------------------------
  deploy:
    name: ③ 部署 MSA 到 Kubernetes
    needs: [build-push-images, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_CONFIGURED: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: 取代码
        uses: actions/checkout@v5
      - name: 校验服务器 Secrets 是否已配置
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::未配置 SERVER_HOST。请按 README「GitHub Secrets 配置」添加 SERVER_HOST / SERVER_USER / SERVER_SSH_KEY，然后重新触发流水线。"
            exit 1
          fi
      - name: 打包部署文件
        run: tar czf lightmark-msa-deploy.tar.gz scripts deploy/k8s database/lightmark.sql .env.example
      - name: 上传部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: lightmark-msa-deploy.tar.gz
          target: /tmp
      - name: SSH 执行 MSA 一键部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            CICD_DIR="$HOME/lightmark-msa-cicd"
            rm -rf "$CICD_DIR" && mkdir -p "$CICD_DIR"
            tar xzf /tmp/lightmark-msa-deploy.tar.gz -C "$CICD_DIR"
            cd "$CICD_DIR"
            bash scripts/deploy-msa-k8s.sh
          envs: TAG,REGISTRY,REPO,COMMIT_SHA,GHCR_USERNAME,GHCR_PAT,SERVER_ENV_BASE64,MSA_INGRESS_HOST,CERT_DIR,DEPLOY_DIR
        env:
          TAG: ${{ env.IMAGE_VERSION }}
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          REPO: ${{ needs.build-push-images.outputs.image_repo }}
          COMMIT_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          SERVER_ENV_BASE64: ${{ secrets.SERVER_ENV_BASE64 }}
          MSA_INGRESS_HOST: ${{ vars.MSA_INGRESS_HOST }}
          CERT_DIR: ${{ vars.CERT_DIR }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      - name: 读取服务器部署历史记录
        if: ${{ always() && env.SERVER_CONFIGURED == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "===== 服务器 MSA 部署历史 ($(hostname)) ====="
            grep '|msa-deploy|' "${DEPLOY_DIR:-$HOME/lightmark}/deploy-history.log" 2>/dev/null | tail -20 || echo "(暂无 MSA 部署记录)"
          envs: DEPLOY_DIR

  # ---------------------------------------------------------------
  # ④ 公网入口健康检查（仅当 ③ 通过；失败即整个流水线失败）
  # ---------------------------------------------------------------
  health-check:
    name: ④ MSA 入口健康检查
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 浏览器入口验证（TLS + 域名 + 前缀路由，直连服务器）
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          MSA_INGRESS_HOST: ${{ vars.MSA_INGRESS_HOST }}
        run: |
          HOST="${MSA_INGRESS_HOST:-msa.lightmark.ortus.top}"
          echo "验证入口: https://$HOST （--resolve 到 $SERVER_HOST）"
          curl -k -fsS --max-time 20 --resolve "$HOST:443:$SERVER_HOST" "https://$HOST/api/health" | grep -q '"UP"'
          # 用户域公开接口（图形验证码）经前缀路由可达
          curl -k -fsS --max-time 20 --resolve "$HOST:443:$SERVER_HOST" -o /dev/null "https://$HOST/api/auth/captcha"
          # 前端首页（Vue 挂载点）经兜底路由可达
          curl -k -fsS --max-time 20 --resolve "$HOST:443:$SERVER_HOST" -o /tmp/msa-index.html "https://$HOST/"
          grep -q 'id="app"' /tmp/msa-index.html
          rm -f /tmp/msa-index.html
          echo "MSA 入口 https://$HOST 可访问（/api/health UP + /api/auth/captcha 路由正常 + 首页含 Vue 挂载点）✓"
