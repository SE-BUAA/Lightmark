spring:
  application:
    name: content-service
  datasource:
    url: jdbc:mysql://${CONTENT_DB_HOST:${DB_HOST:127.0.0.1}}:${CONTENT_DB_PORT:${DB_PORT:3306}}/${CONTENT_DB_NAME:lightmark_content}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${CONTENT_DB_USER:${DB_USER:lightmark}}
    password: ${CONTENT_DB_PASSWORD:${DB_PASSWORD:change-me}}
  flyway:
    enabled: true
    locations: classpath:db/migration/content
    baseline-on-migrate: true
server:
  port: ${CONTENT_SERVICE_PORT:8084}
