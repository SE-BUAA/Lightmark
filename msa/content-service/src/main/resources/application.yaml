spring:
  application:
    name: content-service
  datasource:
    # 生产/联调数据库使用当前可用地址；部署时仍可通过 CONTENT_DB_HOST 覆盖。
    url: jdbc:mysql://${CONTENT_DB_HOST:${DB_HOST:150.230.223.11}}:${CONTENT_DB_PORT:${DB_PORT:3306}}/${CONTENT_DB_NAME:lightmark_content}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${CONTENT_DB_USER:${DB_USER:lightmark}}
    # 密码必须由部署环境注入，示例值不作为运行时默认值。
    password: ${CONTENT_DB_PASSWORD:${DB_PASSWORD:}}
  flyway:
    enabled: true
    locations: classpath:db/migration/content
    baseline-on-migrate: true
lightmark:
  auth:
    jwt:
      # user-service signs tokens; this service only verifies them.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:lightmark}
      expire-minutes: ${JWT_EXPIRE_MINUTES:120}
app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
server:
  port: ${CONTENT_SERVICE_PORT:8084}
