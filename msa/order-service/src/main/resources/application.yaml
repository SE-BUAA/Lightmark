spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://${ORDER_DB_HOST:${DB_HOST:127.0.0.1}}:${ORDER_DB_PORT:${DB_PORT:3306}}/${ORDER_DB_NAME:lightmark_order}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${ORDER_DB_USER:${DB_USER:lightmark}}
    # 密码必须由部署环境注入，示例值不作为运行时默认值。
    password: ${ORDER_DB_PASSWORD:${DB_PASSWORD:}}
  flyway:
    enabled: true
    locations: classpath:db/migration/order
    baseline-on-migrate: true
lightmark:
  auth:
    jwt:
      # user-service signs tokens; this service only verifies them.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:lightmark}
      expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  # 兼容路径：OrderInfrastructureConfig 的本地 JwtTokenService Bean 读取（与 auth.jwt 同一密钥来源）
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:lightmark}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
server:
  port: ${ORDER_SERVICE_PORT:8083}

order:
  clients:
    product-base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
    user-base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
    timeout-ms: ${ORDER_CLIENT_TIMEOUT_MS:3000}
  outbox:
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:20}
    poll-delay-ms: ${ORDER_OUTBOX_POLL_DELAY_MS:5000}
    retry-delay-seconds: ${ORDER_OUTBOX_RETRY_DELAY_SECONDS:30}

resilience4j:
  retry:
    instances:
      product-service:
        max-attempts: 2
        wait-duration: 300ms
      user-service:
        max-attempts: 2
        wait-duration: 300ms
  circuitbreaker:
    instances:
      product-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      user-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
