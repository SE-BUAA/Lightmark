spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${ORDER_DB_HOST:${DB_HOST:127.0.0.1}}:${ORDER_DB_PORT:${DB_PORT:3306}}/${ORDER_DB_NAME:lightmark_order}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${ORDER_DB_USER:${DB_USER:lightmark}}
    password: ${ORDER_DB_PASSWORD:${DB_PASSWORD:change-me}}
  flyway:
    enabled: true
    locations: classpath:db/migration/order
    baseline-on-migrate: true
server:
  port: ${ORDER_SERVICE_PORT:8083}

lightmark:
  jwt:
    secret: ${JWT_SECRET:lightmark-secret-key-please-change}
    issuer: ${JWT_ISSUER:lightmark}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}

order:
  clients:
    product-base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
    user-base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
    timeout-ms: ${ORDER_CLIENT_TIMEOUT_MS:3000}
  outbox:
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:20}
    poll-delay-ms: ${ORDER_OUTBOX_POLL_DELAY_MS:5000}
    retry-delay-seconds: ${ORDER_OUTBOX_RETRY_DELAY_SECONDS:30}

resilience4j:
  retry:
    instances:
      product-service:
        max-attempts: 2
        wait-duration: 300ms
      user-service:
        max-attempts: 2
        wait-duration: 300ms
  circuitbreaker:
    instances:
      product-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      user-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
