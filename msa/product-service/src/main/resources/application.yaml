spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://${PRODUCT_DB_HOST:${DB_HOST:127.0.0.1}}:${PRODUCT_DB_PORT:${DB_PORT:3306}}/${PRODUCT_DB_NAME:lightmark_product}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${PRODUCT_DB_USER:${DB_USER:lightmark}}
    password: ${PRODUCT_DB_PASSWORD:${DB_PASSWORD:change-me}}
  flyway:
    enabled: true
    locations: classpath:db/migration/product
    baseline-on-migrate: true
server:
  port: ${PRODUCT_SERVICE_PORT:8082}
