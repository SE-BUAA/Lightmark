spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${USER_DB_HOST:${DB_HOST:127.0.0.1}}:${USER_DB_PORT:${DB_PORT:3306}}/${USER_DB_NAME:lightmark_user}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${USER_DB_USER:${DB_USER:lightmark}}
    password: ${USER_DB_PASSWORD:${DB_PASSWORD:change-me}}
  flyway:
    enabled: true
    locations: classpath:db/migration/user
    baseline-on-migrate: true
server:
  port: ${USER_SERVICE_PORT:8081}
